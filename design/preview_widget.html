<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1008px; height: 420px; background: transparent; }
  body {
    font-family: "Roboto", "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .widget {
    width: 1008px;
    height: 420px;
    background: rgba(255, 253, 245, 0.8);
    border: 3px solid #E8C766;
    border-radius: 72px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .head { display: flex; align-items: center; justify-content: center; }
  .head svg { width: 36px; height: 36px; flex: none; }
  .title {
    margin-left: 15px;
    font-size: 39px;
    font-weight: 700;
    color: #6B4E00;
    line-height: 46px;
    white-space: nowrap;
  }
  .dates {
    margin-top: 6px;
    text-align: center;
    font-size: 25.5px;
    color: #A07C1F;
    line-height: 30px;
    white-space: nowrap;
  }
  .next-label {
    margin-top: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #A07C1F;
    line-height: 28px;
    white-space: nowrap;
  }
  .next {
    margin-top: 3px;
    text-align: center;
    font-size: 48px;
    font-weight: 700;
    color: #6B4E00;
    line-height: 56px;
    white-space: nowrap;
  }
  .times {
    margin-top: 12px;
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .lbl {
    font-size: 24px;
    line-height: 28px;
    color: #A07C1F;
    white-space: nowrap;
  }
  .time {
    margin-top: 3px;
    font-size: 33px;
    font-weight: 700;
    line-height: 39px;
    color: #4A3A10;
    white-space: nowrap;
  }
  .col.active .lbl { color: #6B4E00; }
  .col.active .time {
    color: #FFFDF5;
    background: #C9A227;
    border-radius: 24px;
    padding: 6px 9px;
    line-height: 39px;
  }
  .pin { margin-top: 15px; display: flex; justify-content: center; }
  .pin svg { width: 33px; height: 33px; }
  .zone {
    margin-top: 3px;
    text-align: center;
    font-size: 25.5px;
    color: #8C6510;
    line-height: 30px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="widget">
    <div class="head">
      <svg viewBox="0 0 48 48" fill="#A67C13" xmlns="http://www.w3.org/2000/svg">
        <path d="M29,5 A19,19 0 1,0 29,43 A15,15 0 0,1 29,5 Z"/>
        <path d="M39,8 L40.5,11.9 L44.6,12.3 L41.5,15 L42.4,19 L39,16.8 L35.6,19 L36.5,15 L33.4,12.3 L37.5,11.9 Z"/>
      </svg>
      <div class="title">Waktu Solat DZ</div>
    </div>

    <div class="dates">6 Rabiulakhir 1448H &middot; 17 Oktober 2026</div>

    <div class="next-label">SOLAT SETERUSNYA</div>
    <div class="next">Isyak &middot; 20:11</div>

    <div class="times">
      <div class="col"><div class="lbl">Imsak</div><div class="time">05:40</div></div>
      <div class="col"><div class="lbl">Subuh</div><div class="time">05:50</div></div>
      <div class="col"><div class="lbl">Syuruk</div><div class="time">06:58</div></div>
      <div class="col"><div class="lbl">Dhuha</div><div class="time">07:26</div></div>
      <div class="col"><div class="lbl">Zohor</div><div class="time">13:01</div></div>
      <div class="col"><div class="lbl">Asar</div><div class="time">16:18</div></div>
      <div class="col active"><div class="lbl">Maghrib</div><div class="time">19:01</div></div>
      <div class="col"><div class="lbl">Isyak</div><div class="time">20:11</div></div>
    </div>

    <div class="pin">
      <svg viewBox="0 0 24 24" fill="#8C6510" xmlns="http://www.w3.org/2000/svg">
        <path d="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7zM12,11.5c-1.38,0 -2.5,-1.12 -2.5,-2.5s1.12,-2.5 2.5,-2.5 2.5,1.12 2.5,2.5 -1.12,2.5 -2.5,2.5z"/>
      </svg>
    </div>
    <div class="zone">WLY01 &middot; Wilayah Persekutuan</div>
  </div>
</body>
</html>
